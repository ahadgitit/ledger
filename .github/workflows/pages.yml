name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/dashboard-standalone-service-j5hhan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts parse
        run: for f in config.js logic.js app.js; do node --check "$f"; done
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css config.js logic.js app.js .nojekyll _site/
          # Stamp asset URLs with the commit so browsers fetch new files after each deploy
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(styles\.css|config\.js|logic\.js|app\.js)\"#\1=\"\2?v=$v\"#g" _site/index.html
          grep -c "?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
