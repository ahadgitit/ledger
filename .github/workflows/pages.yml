name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/dashboard-standalone-service-j5hhan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ledger.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: ledger.apk
          retention-days: 30

  deploy:
    needs: android
    # Publish the site even if the Android build failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts parse
        run: for f in config.js logic.js viz.js app.js views.js forecast.js editor.js sw.js; do node --check "$f"; done
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css config.js logic.js viz.js app.js views.js forecast.js editor.js sw.js manifest.webmanifest .nojekyll _site/
          cp -r icons _site/
          # Stamp asset URLs with the commit so browsers fetch new files after each deploy
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(styles\.css|config\.js|logic\.js|app\.js|editor\.js|viz\.js|views\.js|forecast\.js)\"#\1=\"\2?v=$v\"#g" _site/index.html
          grep -c "?v=$v" _site/index.html
      - name: Add the APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ledger-apk
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
