// Ledger for Android: a Trusted Web Activity that opens the hosted workspace in Chrome's
// engine, so Google sign-in, storage and updates behave exactly as on the website.
plugins {
    id 'com.android.application'
}

def env = System.getenv()

android {
    namespace 'io.github.ahadgitit.ledger'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ahadgitit.ledger'
        minSdk 21
        targetSdk 35
        versionCode((env.GITHUB_RUN_NUMBER ?: '1') as int)
        versionName "1.0.${env.GITHUB_RUN_NUMBER ?: '0'}"
    }

    signingConfigs {
        release {
            // CI can supply its own key through secrets; otherwise the key in this folder is used.
            storeFile file(env.LEDGER_KEYSTORE_PATH ?: '../ledger.keystore')
            storePassword env.LEDGER_KEYSTORE_PASSWORD ?: 'ledger-sideload'
            keyAlias env.LEDGER_KEY_ALIAS ?: 'ledger'
            keyPassword env.LEDGER_KEY_PASSWORD ?: 'ledger-sideload'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
